name: NBA EDGE Public Consensus Radar
on:
  workflow_dispatch:
  schedule:
    - cron: '13 * * * *'
permissions:
  contents: write
concurrency:
  group: nbaedge-public-consensus
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read recent public NBA articles
        run: python scripts/update_consensus.py
      - name: Publish results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/public_consensus.json
          git diff --cached --quiet || (git commit -m "Refresh public NBA DFS mentions" && git pull --rebase && git push)
