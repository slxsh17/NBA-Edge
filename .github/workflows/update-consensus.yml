name: NBA EDGE Public Consensus Radar
on:
  workflow_dispatch:
  schedule:
    - cron: '7,37 14-23 * * *'
permissions:
  contents: write
concurrency:
  group: nbaedge-public-consensus
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read public projected ownership and pick articles
        run: python scripts/update_consensus.py
      - name: Publish results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/public_consensus.json data/consensus
          git diff --cached --quiet && exit 0
          git commit -m "Refresh public NBA DFS consensus"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && exit 0; sleep 5; done
          exit 1
