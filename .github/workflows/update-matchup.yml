name: NBA EDGE Matchup and Usage Feed
on:
  workflow_dispatch:
  schedule:
    - cron: '23 */6 * * *'
permissions:
  contents: write
concurrency:
  group: nba-edge-matchups
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compute DvP and usage
        run: python scripts/update_matchup_usage.py
      - name: Commit research snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/matchup_usage.json
          git diff --cached --quiet || (git commit -m "Refresh matchup and usage research" && git push)
