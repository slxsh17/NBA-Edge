name: ntfy test (temporary)
on:
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Send a test notification
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC || 'nbaedge' }}
        run: |
          curl -sS -f -H "Title: NBA EDGE alerts connected" -H "Tags: basketball" -H "Click: https://slxsh17.github.io/NBA-Edge/" \
            -d "You'll get a push here when a player projected 15+ is ruled out, a minutes limit is reported, or a starter is confirmed." \
            "https://ntfy.sh/$NTFY_TOPIC"
