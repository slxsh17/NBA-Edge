name: NBA EDGE Automatic Projection Baselines

on:
  workflow_dispatch:
  schedule:
    - cron: '11 * * * *'

permissions:
  contents: write

concurrency:
  group: nba-edge-auto-projection
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build projections from published data
        run: python scripts/build_automatic_projections.py
      - name: Publish projection snapshot
        run: |
          if [ ! -f data/automatic_projections.json ]; then
            echo "No today's published slate; no projection snapshot generated."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/automatic_projections.json
          git diff --cached --quiet || (git commit -m "Update NBA EDGE projection baseline" && git pull --rebase && git push)
