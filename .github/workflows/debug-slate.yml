name: Debug slate source (temporary)
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe DailyFantasyFuel slates
        run: |
          python - <<'PY'
          import re, sys, datetime as dt
          sys.path.insert(0, 'scripts')
          import update_slate as U
          from zoneinfo import ZoneInfo
          day = dt.datetime.now(ZoneInfo('America/New_York')).date().isoformat()
          out = []
          pg = U.fetch(f'https://www.dailyfantasyfuel.com/nba/projections/fanduel/{day}/')
          out.append(f"default: slate={U.page_var(pg,'slate')!r} url={U.page_var(pg,'url')!r} start={U.page_var(pg,'url_start_date')!r} rows={len(U.ROW.findall(pg))}")
          out.append('window vars: ' + '; '.join(f'{k}={v[:40]}' for k, v in re.findall(r"window\.(\w+)\s*=\s*'([^']*)'", pg))[:1500])
          out.append('slate links: ' + ', '.join(sorted(set(re.findall(r'[?&]slate=([0-9A-Za-z]+)', pg))))[:600])
          out.append('slate-ish text: ' + ' | '.join(sorted(set(m.strip() for m in re.findall(r'>([^<>]{0,40}(?:Main|Early|Night|All Day|Turbo|Late|Afternoon)[^<>]{0,40})<', pg))))[:900])
          start = U.page_var(pg, 'url')
          f = b = start
          ids = []
          for _ in range(6):
              f, b = U.next_id(f), U.prev_id(b); ids += [f, b]
          for sid in ids:
              for base in ('https://www.dailyfantasyfuel.com/nba/projections/fanduel/{day}/?slate={sid}',):
                  try:
                      p = U.fetch(base.format(day=day, sid=sid))
                      out.append(f"{sid}: slate={U.page_var(p,'slate')!r} url={U.page_var(p,'url')!r} start={U.page_var(p,'url_start_date')!r} teams={U.page_var(p,'team_count')!r} rows={len(U.ROW.findall(p))}")
                  except Exception as e:
                      out.append(f'{sid}: {e}')
          print('::warning::' + ' || '.join(out).replace('\n', ' '))
          PY
