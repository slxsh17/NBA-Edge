name: Swap alert test (temporary)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install highspy numpy
      - name: Post a test entry to a test topic, then run the swap check against it
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC || 'nbaedge' }}
          NTFY_ENTRIES_TOPIC: nbaedge-entries-test-${{ github.run_id }}
        run: |
          python - <<'PY'
          import json, os, sys, time, datetime as dt, urllib.request
          sys.path.insert(0, 'scripts')
          import alerts as A
          today = A.read(A.DATA / 'today.json'); day = today['date']
          outs = [p for p in today['players'] if p.get('main') and p.get('out') and p.get('salary')]
          victim = max(outs, key=lambda p: p['salary'])
          lu = json.load(open(f'data/lineups/{day}.json'))['slates']['main']['lineups'][0]
          s = [[p['name'], p['team'], p['slot']] for p in lu['players']]
          slot = next(r for r in s if r[2] == 'UTIL'); slot[0], slot[1] = victim['name'], victim['team']
          msg = {'v': 1, 'day': day, 'fmt': 'main', 'at': int(time.time() * 1000), 'n': 1, 'i': 0, 'e': [{'l': 'TEST lineup', 's': s}]}
          urllib.request.urlopen(urllib.request.Request(f"https://ntfy.sh/{os.environ['NTFY_ENTRIES_TOPIC']}", data=json.dumps(msg).encode(), method='POST'), timeout=20)
          time.sleep(3)
          now = dt.datetime.now(dt.timezone.utc); tips = {}
          for g in today['games']:
              t = dt.datetime.fromisoformat(g['time'].replace('Z', '+00:00')); tips[g['home']] = tips[g['away']] = (t, '')
          ents = A.load_entries(day)
          sw = A.entry_swaps(today, ents, now, tips)
          print('::warning::entries read back: ' + str(len(ents.get('main', []))) + '; swaps: ' + json.dumps(sw)[:700])
          for x in sw[:1]:
              body = f"TEST of the new swap alert. {x['entry']}, {x['slot']}: {x['out_player']} -> {x['swap']['name']} ({x['swap']['team']}, ${x['swap']['salary']:,}, {x['swap']['proj']} proj)." if x['swap'] else 'TEST: no swap fits'
              print('push status', A.push(os.environ['NTFY_TOPIC'], 'TEST: swap alert for your entries', body, 'warning'))
          PY
