name: Odds API key check (temporary)
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check ODDS_API_KEY with the free events endpoint
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          python3 - <<'PY'
          import os, json, urllib.request
          k = os.environ.get('ODDS_API_KEY', '').strip()
          if not k:
              print('::warning::ODDS_API_KEY secret is not set'); raise SystemExit(0)
          try:
              with urllib.request.urlopen(f'https://api.the-odds-api.com/v4/sports/basketball_nba/events?apiKey={k}', timeout=30) as r:
                  ev = json.loads(r.read()); rem = r.headers.get('x-requests-remaining'); used = r.headers.get('x-requests-used')
              print(f'::warning::key works: {len(ev)} NBA events listed; credits remaining {rem}, used {used}')
          except Exception as e:
              print(f'::warning::key check failed: {e}')
          PY
