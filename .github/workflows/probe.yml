name: probe-slate-sources
on:
  push:
    branches: [probe-slate]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          rm -rf probe probe_out.txt; mkdir -p probe
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36'
          get(){ curl -sSL -A "$UA" -o "probe/$1" -w "$1 HTTP %{http_code} size %{size_download} final %{url_effective}\n" "$2" >> probe_out.txt || true; }
          get sg_today.html "https://www.dailyfantasyfuel.com/nba/showdown-single-game-projections/fanduel/2026-10-26/"
          get sg_tomorrow.html "https://www.dailyfantasyfuel.com/nba/showdown-single-game-projections/fanduel/2026-10-27/"
          get main_tomorrow.html "https://www.dailyfantasyfuel.com/nba/projections/fanduel/2026-10-27/"
          get proj.js "https://dff-common.s3.amazonaws.com/projections_mini.gz.js?734f96"
          ls -la probe >> probe_out.txt
      - run: |
          git config user.name bot && git config user.email bot@x
          git add -A probe probe_out.txt && git commit -qm probe-results && git push
