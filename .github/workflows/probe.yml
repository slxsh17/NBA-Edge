name: probe-slate-sources
on:
  push:
    branches: [probe-slate]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          rm -rf probe probe_out.txt; mkdir -p probe
          python3 - <<'PY' > probe_out.txt
          import re,urllib.request,time
          UA={'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) Chrome/124 Safari/537.36'}
          get=lambda u:urllib.request.urlopen(urllib.request.Request(u,headers=UA),timeout=30).read().decode('utf-8','replace')
          v=lambda p,n:(re.search(r"window\.%s\s*=\s*'([^']*)'"%n,p) or [None,''])[1]
          m=get('https://www.dailyfantasyfuel.com/nba/projections/fanduel/2026-10-28/')
          start=v(m,'url');print('main',start,v(m,'slate'))
          s=get('https://www.dailyfantasyfuel.com/nba/showdown-single-game-projections/fanduel/2026-10-28/')
          print('default single page:',v(s,'url'),v(s,'slate'),v(s,'url_start_date'),v(s,'team_count'))
          d='0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ'
          def b36(n):
              o=''
              while n:n,r=divmod(n,36);o=d[r]+o
              return o
          for n in range(int(start,36)-12,int(start,36)+14):
              sid=b36(n);p=get('https://www.dailyfantasyfuel.com/nba/showdown-single-game-projections/fanduel/2026-10-28/?slate='+sid)
              print(sid,v(p,'url_start_date'),v(p,'slate'),v(p,'team_count'));time.sleep(.5)
          PY
      - run: |
          git config user.name bot && git config user.email bot@x
          git add -A probe_out.txt && git commit -qm probe-results && git push
