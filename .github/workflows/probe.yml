name: probe-slate-sources
on:
  push:
    branches: [probe-slate]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          rm -rf probe probe_out.txt; mkdir -p probe
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36'
          get(){ curl -sSL -A "$UA" -o "probe/$1" -w "$1 HTTP %{http_code} size %{size_download} final %{url_effective}\n" "$2" >> probe_out.txt || true; }
          get ls_own.html "https://www.linestarapp.com/Ownership/Sport/NBA/Site/FanDuel"
          get fta_own.html "https://fantasyteamadvice.com/ownerships?sport=nba"
          get stok_own.html "https://www.stokastic.com/nba/nba-dfs-ownership"
          get ls_api.json "https://www.linestarapp.com/DesktopModules/DailyFantasyApi/API/Fantasy/GetSalariesV5?sport=2&site=2&periodId=-1"
          for f in probe/*.html probe/*.json; do echo "== $f" >> probe_out.txt; grep -oiE ".{0,120}(own(ership)?[%\" :=]|periodId|PeriodId|actual).{0,160}" $f | head -12 >> probe_out.txt; grep -oE "(https?:)?//[a-zA-Z0-9./_-]*(api|Api|API)[a-zA-Z0-9./_?=&-]*" $f | sort -u | head -15 >> probe_out.txt; done
          ls -la probe >> probe_out.txt
      - run: |
          git config user.name bot && git config user.email bot@x
          git add -A probe probe_out.txt && git commit -qm probe-results && git push
