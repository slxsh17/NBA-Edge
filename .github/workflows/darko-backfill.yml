name: DARKO backfill (one-off)
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: nba-edge-pipeline
  cancel-in-progress: false
jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: DARKO as of the day before each graded night, and today's
        run: |
          days=$(ls data/history/*.json | xargs -n1 basename | sed 's/.json//' | tr '\n' ' ')
          python scripts/update_darko.py --backfill $days
          python scripts/update_darko.py --force
      - name: Publish
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A data/history data/archive data/darko.json
          git diff --cached --quiet && exit 0
          git commit -m 'DARKO backfill for graded nights'
          for i in 1 2 3; do git pull --rebase --autostash -X theirs && git push && exit 0; git rebase --abort 2>/dev/null || true; sleep 5; done
          exit 1
