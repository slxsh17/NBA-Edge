name: Probe data sources (temporary)
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe
        run: |
          python - <<'PY'
          import re, sys, json, datetime as dt, urllib.request
          sys.path.insert(0, 'scripts')
          import update_slate as U
          from zoneinfo import ZoneInfo
          day = dt.datetime.now(ZoneInfo('America/New_York')).date().isoformat()
          def get(url, headers=None, n=200):
              try:
                  req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36', **(headers or {})})
                  with urllib.request.urlopen(req, timeout=25) as r:
                      b = r.read().decode('utf-8', 'replace')
                      return f'{r.status} len={len(b)}', b
              except Exception as e:
                  return f'ERR {e!r}'[:160], ''
          out = []
          st, pg = get(f'https://www.dailyfantasyfuel.com/nba/projections/fanduel/{day}/')
          rows = U.ROW.findall(pg)
          if rows:
              keys = sorted({k for k, v in U.ATTR.findall(rows[0])})
              out.append('DFF row attrs: ' + ','.join(keys))
              out.append('DFF row0: ' + ' '.join(f'{k}={v}' for k, v in U.ATTR.findall(rows[0]))[:900])
          nba_h = {'Referer': 'https://www.nba.com/', 'Origin': 'https://www.nba.com', 'x-nba-stats-origin': 'stats', 'x-nba-stats-token': 'true', 'Accept': 'application/json'}
          st, b = get('https://stats.nba.com/stats/leaguedashptstats?College=&Conference=&Country=&DateFrom=&DateTo=&Division=&DraftPick=&DraftYear=&GameScope=&Height=&LastNGames=0&LeagueID=00&Location=&Month=0&OpponentTeamID=0&Outcome=&PORound=0&PerMode=PerGame&PlayerExperience=&PlayerOrTeam=Player&PlayerPosition=&PtMeasureType=Passing&Season=2026-27&SeasonSegment=&SeasonType=Regular%20Season&StarterBench=&TeamID=0&VsConference=&VsDivision=&Weight=', nba_h)
          out.append('NBA tracking passing: ' + st + ' ' + b[:150].replace('\n',' '))
          st, b = get('https://stats.nba.com/stats/leaguedashplayerstats?MeasureType=Advanced&PerMode=PerGame&Season=2026-27&SeasonType=Regular%20Season&LeagueID=00&LastNGames=0&Month=0&OpponentTeamID=0&PORound=0&PaceAdjust=N&Period=0&PlusMinus=N&Rank=N&TeamID=0&DateFrom=&DateTo=&GameScope=&GameSegment=&Location=&Outcome=&PlayerExperience=&PlayerPosition=&SeasonSegment=&ShotClockRange=&StarterBench=&VsConference=&VsDivision=&College=&Conference=&Country=&Division=&DraftPick=&DraftYear=&Height=&Weight=', nba_h)
          out.append('NBA advanced: ' + st + ' ' + b[:150].replace('\n',' '))
          st, b = get('https://api.pbpstats.com/get-totals/nba?Season=2025-26&SeasonType=Regular%2BSeason&Type=Player')
          out.append('pbpstats: ' + st + ' ' + b[:120].replace('\n',' '))
          st, b = get('https://www.fanduel.com/research/nba/fantasy/dfs-projections')
          out.append('FanDuel Research: ' + st + ' has_proj=' + str('projection' in b.lower()) + ' ' + (re.search(r'<title>([^<]*)', b) or [0, ''])[1][:80])
          st, b = get('https://www.darko.app/')
          out.append('DARKO: ' + st + ' ' + (re.search(r'<title>([^<]*)', b) or [0, ''])[1][:80])
          print('::warning::' + ' || '.join(out).replace('\n', ' '))
          PY
