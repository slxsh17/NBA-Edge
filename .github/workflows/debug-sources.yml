name: Probe data sources (temporary)
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe
        run: |
          python - <<'PY'
          import re, sys, json, datetime as dt, urllib.request
          sys.path.insert(0, 'scripts')
          import update_slate as U
          from zoneinfo import ZoneInfo
          day = dt.datetime.now(ZoneInfo('America/New_York')).date().isoformat()
          def get(url, headers=None, n=200):
              try:
                  req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36', **(headers or {})})
                  with urllib.request.urlopen(req, timeout=25) as r:
                      b = r.read().decode('utf-8', 'replace')
                      return f'{r.status} len={len(b)}', b
              except Exception as e:
                  return f'ERR {e!r}'[:160], ''
          out = []
          import update_darko as D
          page = D.fetch(D.URL)
          for nm in ('Dean Wade', 'Jock Landale', 'Ryan Kalkbrenner', 'Victor Wembanyama'):
              out.append(f'{nm}: {page.count(nm)}')
          scripts = re.findall(r'<script[^>]*>(.*?)</script>', page, re.S)
          out.append('inline scripts sizes: ' + str(sorted((len(x) for x in scripts), reverse=True)[:6]))
          big = max(scripts, key=len) if scripts else ''
          i = big.find('Wembanyama'); out.append('big script near Wemby: ' + re.sub(r'\s+', ' ', big[max(0, i-300):i+500]) if i >= 0 else 'big script head: ' + big[:400])
          for q in ('?page=2', '?page=1&per=500', '?limit=1000'):
              p2 = D.fetch(D.URL + q); h2, r2 = D.parse(p2)
              out.append(f'{q}: rows={len(r2)} first={r2[0]["name"] if r2 else None} last={r2[-1]["name"] if r2 else None}')
          for path in ('/projections.csv', '/api/projections.csv', '/projections/__data.json', '/projections/__data.json?x-sveltekit-invalidated=01'):
              try:
                  b = D.fetch('https://www.darko.app' + path); out.append(f'{path}: len={len(b)} head={b[:200]!r}')
              except Exception as e:
                  out.append(f'{path}: {e}')
          print('::warning::' + ' || '.join(out).replace('\n', ' '))
          PY
