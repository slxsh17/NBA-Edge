name: Probe data sources (temporary)
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe
        run: |
          python - <<'PY'
          import re, sys, json, datetime as dt, urllib.request
          sys.path.insert(0, 'scripts')
          import update_slate as U
          from zoneinfo import ZoneInfo
          day = dt.datetime.now(ZoneInfo('America/New_York')).date().isoformat()
          def get(url, headers=None, n=200):
              try:
                  req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36', **(headers or {})})
                  with urllib.request.urlopen(req, timeout=25) as r:
                      b = r.read().decode('utf-8', 'replace')
                      return f'{r.status} len={len(b)}', b
              except Exception as e:
                  return f'ERR {e!r}'[:160], ''
          out = []
          st, rb = get('https://www.darko.app/robots.txt'); out.append('robots: ' + st + ' ' + rb[:300].replace('\n', ' | '))
          for path in ('/projections', '/daily'):
              st, b = get('https://www.darko.app' + path)
              out.append(f'{path} {st}')
              i = b.find('Wembanyama')
              out.append('near Wemby: ' + re.sub(r'\s+', ' ', re.sub(r'<[^>]+>', ' ', b[max(0, i-1500):i+1500]))[:900] if i >= 0 else 'no Wemby')
              out.append('raw near: ' + re.sub(r'\s+', ' ', b[max(0, i-400):i+400])[:800] if i >= 0 else '')
              out.append('data hints: ' + ', '.join(sorted(set(re.findall(r'(__[A-Za-z_]+__|sveltekit[^"\s]{0,40}|data-[a-z_-]+=)', b)))[:40])[:500])
              out.append('fantasy words: ' + ', '.join(sorted(set(w.lower() for w in re.findall(r'\b(FanDuel|DraftKings|minutes|MIN|FPTS|fpts|salary|value|ownership)\b', b))))[:200])
          print('::warning::' + ' || '.join(out).replace('\n', ' '))
          PY
