name: Probe data sources (temporary)
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe
        run: |
          python - <<'PY'
          import re, sys, json, datetime as dt, urllib.request
          sys.path.insert(0, 'scripts')
          import update_slate as U
          from zoneinfo import ZoneInfo
          day = dt.datetime.now(ZoneInfo('America/New_York')).date().isoformat()
          def get(url, headers=None, n=200):
              try:
                  req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36', **(headers or {})})
                  with urllib.request.urlopen(req, timeout=25) as r:
                      b = r.read().decode('utf-8', 'replace')
                      return f'{r.status} len={len(b)}', b
              except Exception as e:
                  return f'ERR {e!r}'[:160], ''
          out = []
          import update_darko as D
          page = D.fetch(D.URL)
          head, rows = D.parse(page)
          out.append(f'columns={head} rows={len(rows)} tables={len(re.findall("<table", page))} trs={len(re.findall("<tr", page))}')
          for r in rows[:3] + rows[-2:]:
              out.append(json.dumps(r))
          out.append('pagination hints: ' + ', '.join(sorted(set(re.findall(r'(?:page|limit|show|rows|per)[=:][^"&\s]{0,12}', page, re.I))))[:300])
          out.append('buttons: ' + ', '.join(sorted(set(re.sub(r'<[^>]+>', '', b).strip() for b in re.findall(r'<button[^>]*>(.*?)</button>', page, re.S))))[:400])
          print('::warning::' + ' || '.join(out).replace('\n', ' '))
          PY
