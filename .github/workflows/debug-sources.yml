name: Probe data sources (temporary)
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe
        run: |
          python - <<'PY'
          import re, sys, json, datetime as dt, urllib.request
          sys.path.insert(0, 'scripts')
          import update_slate as U
          from zoneinfo import ZoneInfo
          day = dt.datetime.now(ZoneInfo('America/New_York')).date().isoformat()
          def get(url, headers=None, n=200):
              try:
                  req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36', **(headers or {})})
                  with urllib.request.urlopen(req, timeout=25) as r:
                      b = r.read().decode('utf-8', 'replace')
                      return f'{r.status} len={len(b)}', b
              except Exception as e:
                  return f'ERR {e!r}'[:160], ''
          out = []
          st, b = get('https://www.darko.app/')
          out.append('DARKO ' + st)
          out.append('scripts: ' + ', '.join(sorted(set(re.findall(r'<script[^>]+src="([^"]+)"', b))))[:500])
          out.append('json-ish: ' + ', '.join(sorted(set(re.findall(r'["\'](/[^"\'\s]*(?:api|json|csv|data)[^"\'\s]*)["\']', b))))[:600])
          out.append('links: ' + ', '.join(sorted(set(re.findall(r'href="(/[^"#]*)"', b))))[:500])
          m = re.search(r'<script id="__NEXT_DATA__"[^>]*>(.*?)</script>', b, re.S)
          if m:
              nd = json.loads(m.group(1)); out.append('NEXT_DATA keys: ' + str(list((nd.get('props') or {}).get('pageProps', {}).keys()))[:300])
          out.append('text sample: ' + re.sub(r'<[^>]+>', ' ', b)[:400].replace('\n', ' '))
          for path in ('/projections', '/api/projections', '/daily', '/box-score-projections'):
              st2, b2 = get('https://www.darko.app' + path)
              out.append(f'{path}: {st2} ' + (re.search(r'<title>([^<]*)', b2) or [0, ''])[1][:60])
          st, b = get('https://www.fanduel.com/research/nba/fantasy/dfs-projections')
          m = re.search(r'<script id="__NEXT_DATA__"[^>]*>(.*?)</script>', b, re.S)
          out.append('FD research NEXT_DATA: ' + (str(len(m.group(1))) if m else 'none'))
          out.append('FD api-ish: ' + ', '.join(sorted(set(re.findall(r'https://[a-z0-9.-]*fanduel[a-z0-9./-]*(?:api|graphql)[^"\'\s]*', b))))[:400])
          if m:
              txt = m.group(1)
              i = txt.find('Wembanyama'); out.append('FD near player: ' + txt[max(0, i-300):i+300] if i >= 0 else 'FD: no player name in NEXT_DATA')
          print('::warning::' + ' || '.join(out).replace('\n', ' '))
          PY
