name: Probe data sources (temporary)
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe
        run: |
          python - <<'PY'
          import re, sys, json, datetime as dt, urllib.request
          sys.path.insert(0, 'scripts')
          import update_slate as U
          from zoneinfo import ZoneInfo
          day = dt.datetime.now(ZoneInfo('America/New_York')).date().isoformat()
          def get(url, headers=None, n=200):
              try:
                  req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36', **(headers or {})})
                  with urllib.request.urlopen(req, timeout=25) as r:
                      b = r.read().decode('utf-8', 'replace')
                      return f'{r.status} len={len(b)}', b
              except Exception as e:
                  return f'ERR {e!r}'[:160], ''
          out = []
          import update_darko as D
          page = D.fetch(D.URL)
          rows = D.parse_data(page)
          out.append(f'embedded rows={len(rows)} dates={sorted(set(r["date"] for r in rows))[-3:]} sample={rows[0]["name"]} {rows[0]["fd"]}')
          tm = sorted(set(re.findall(r'(?:time-machine|timemachine|asOf|as_of|date)=?[^"&\s<]{0,20}', page, re.I)))[:15]
          out.append('time machine hints: ' + ', '.join(tm))
          for q in ('?date=2026-10-25', '?as_of=2026-10-25', '?asof=2026-10-25', '?d=2026-10-25'):
              try:
                  p2 = D.fetch(D.URL + q); r2 = D.parse_data(p2)
                  out.append(f'{q}: rows={len(r2)} dates={sorted(set(r["date"] for r in r2))[-2:]} wemby={[ (r["fd"], r["date"]) for r in r2 if "Wembanyama" in r["name"]][:1]}')
              except Exception as e:
                  out.append(f'{q}: {e}')
          links = sorted(set(re.findall(r'href="(/[^"#]*(?:time|machine|date)[^"#]*)"', page, re.I)))[:10]
          out.append('time links: ' + ', '.join(links))
          for line in out[:10]:
              print('::warning::' + re.sub(r'[^ -~]', '?', line).replace('::', ': :')[:900])
          PY
