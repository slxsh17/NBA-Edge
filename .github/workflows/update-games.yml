
name: NBA EDGE Daily Data Updates

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Update NBA schedule
        run: python scripts/update_games.py

      - name: Update player statistics
        run: python scripts/update_player_stats.py

      - name: Save updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/games.json data/player_stats.json
          git diff --cached --quiet || (git commit -m "Update NBA analytics" && git push)

