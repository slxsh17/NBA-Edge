name: Odds links probe (temporary)
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: One FanDuel props call with deep links (1 credit)
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.parse
          k = urllib.parse.quote(os.environ['ODDS_API_KEY'].strip())
          api = 'https://api.the-odds-api.com/v4/sports/basketball_nba'
          ev = json.load(urllib.request.urlopen(f'{api}/events?apiKey={k}', timeout=30))
          e = ev[0]
          r = urllib.request.urlopen(f"{api}/events/{e['id']}/odds?apiKey={k}&regions=us&bookmakers=fanduel&markets=player_points&oddsFormat=american&includeLinks=true&includeSids=true", timeout=30)
          d = json.load(r)
          print('::warning::credits left ' + str(r.headers.get('x-requests-remaining')))
          for b in d.get('bookmakers', []):
              print('::warning::book link ' + str(b.get('link')) + ' sid ' + str(b.get('sid')))
              for m in b.get('markets', [])[:1]:
                  print('::warning::market keys ' + ','.join(m.keys()) + ' link ' + str(m.get('link')) + ' sid ' + str(m.get('sid')))
                  for o in m.get('outcomes', [])[:2]:
                      print('::warning::outcome ' + json.dumps(o).replace('::', ' '))
          PY
