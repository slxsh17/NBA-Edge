
name: NBA EDGE Historical Backfill

on:
  workflow_dispatch:
  schedule:
    - cron: '17 4,16 * * *'

permissions:
  contents: write

concurrency:
  group: nba-edge-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch next historical dates
        run: python scripts/backfill_last_season.py

      - name: Save accumulated history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/last_season_stats.json
          git diff --cached --quiet || (git commit -m "Backfill NBA 2025-26 history" && git push)
