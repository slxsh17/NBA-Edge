
name: NBA EDGE Historical Backfill

on:
  workflow_dispatch:
    inputs:
      days:
        description: 'Dates to fetch this run (1-31)'
        required: false
        default: '31'
  schedule:
    - cron: '17 4,16 * * *'

permissions:
  contents: write

concurrency:
  group: nba-edge-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch next historical dates
        env:
          BACKFILL_DAYS: ${{ github.event.inputs.days || '12' }}
        run: python scripts/backfill_last_season.py

      - name: Save accumulated history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/last_season_stats.json
          git diff --cached --quiet && exit 0
          git commit -m "Backfill NBA 2025-26 history"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && exit 0; sleep 5; done
          exit 1
