name: NBA EDGE Starters & Minutes News
on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'
permissions:
  contents: write
concurrency:
  group: nba-edge-lineup-news
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install public HTML parser
        run: python -m pip install 'beautifulsoup4>=4.12,<5'
      - name: Retrieve NBA starters and rotation headlines
        run: python scripts/update_lineup_news.py
      - name: Save public news snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/lineup_news.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh public NBA starting lineup and rotation news'
            git pull --rebase origin main
            git push
          fi
