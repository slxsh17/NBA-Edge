name: NBA EDGE Injury Refresh
on:
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'
permissions:
  contents: write
concurrency:
  group: nba-edge-injuries
  cancel-in-progress: false
jobs:
  injuries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch NBA injury reports
        run: python scripts/update_injuries.py
      - name: Commit latest snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/injuries.json
          git diff --cached --quiet || (git commit -m "Update NBA injuries" && git push)
